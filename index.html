
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>கல்வி ஆப் லாகின்</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>பள்ளி லாகின்</h2>
        <form id="loginForm">
            <label for="role">பிரிவைத் தேர்ந்தெடுக்கவும்:</label>
            <select id="role" required>
                <option value="school">பள்ளி நிர்வாகம்</option>
                <option value="teacher">ஆசிரியர்</option>
                <option value="parent">பெற்றோர்</option>
            </select>

            <label for="username">பயனர்பெயர் (Index Number/Username):</label>
            <input type="text" id="username" required>

            <label for="password">கடவுச்சொல் (Password):</label>
            <input type="password" id="password" required>

            <button type="submit">உள்நுழைய</button>

            <div class="options">
                <a href="#" id="forgotPassword">கடவுச்சொல் மறந்துவிட்டதா? (Serial Number பயன்படுத்தவும்)</a>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
